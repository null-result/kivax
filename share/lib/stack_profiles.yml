# Catalog of stack profiles known to Kivax.
# The 'kivax init' wizard uses 'detect_markers' (paths relative to a
# candidate subdirectory) to propose profiles automatically, and copies the
# rest of the fields (test_globs, id_tag_regexes, commands) as-is into the
# project's .kivax/config.yml. You can edit it by hand afterwards.
java-spring:
  label: "Java / Spring Boot (Maven)"
  detect_markers: ["pom.xml", "mvnw"]
  test_globs:
    - "src/test/java/**/*.java"
    - "src/it/java/**/*.java"
  id_tag_regexes:
    - '@Tag\("(?P<id>(?:REQ|IT)-(?:\d{2,}-)?\d{3})"\)'
  cmd_test_unit: "./mvnw -q test"
  cmd_test_it:   "./mvnw -q verify -Pintegration"

python-pytest:
  label: "Python (pytest)"
  detect_markers: ["pyproject.toml", "setup.py", "requirements.txt"]
  test_globs:
    - "tests/**/*.py"
  id_tag_regexes:
    - '@pytest\.mark\.req\("(?P<id>(?:REQ|IT)-(?:\d{2,}-)?\d{3})"\)'
  cmd_test_unit: "pytest -q -m 'not it'"
  cmd_test_it:   "pytest -q -m it"

node-jest:
  label: "Node.js (Jest)"
  detect_markers: ["package.json"]
  test_globs:
    - "**/*.test.ts"
    - "**/*.test.js"
  id_tag_regexes:
    - 'describe\(.*\[(?P<id>(?:REQ|IT)-(?:\d{2,}-)?\d{3})\]'
    - 'it\(.*\[(?P<id>(?:REQ|IT)-(?:\d{2,}-)?\d{3})\]'
  cmd_test_unit: "npx jest --testPathIgnorePatterns=integration"
  cmd_test_it:   "npx jest integration"

go:
  label: "Go"
  detect_markers: ["go.mod"]
  test_globs:
    - "**/*_test.go"
  id_tag_regexes:
    - '//\s*kivax:(?P<id>(?:REQ|IT)-(?:\d{2,}-)?\d{3})'
  cmd_test_unit: "go test ./... -short"
  cmd_test_it:   "go test ./... -run Integration"
