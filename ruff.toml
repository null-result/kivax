# Deliberately permissive: this gate exists to catch real defects and to stop
# style being argued in review, not to reject a contribution over aesthetics.
#
# There is no pyproject.toml on purpose — Kivax isn't a pip package. It's
# installed by cloning the repo and running install.py, and the CLI runs
# straight from the checkout.
line-length = 110
target-version = "py310"

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes — undefined names, unused imports, real bugs
  "W",    # pycodestyle warnings
  "I",    # import sorting
  "UP",   # pyupgrade — don't write 3.6-era Python on a 3.10+ floor
  "B",    # flake8-bugbear — likely-wrong constructs
]
ignore = [
  "E501",  # line length is checked by the formatter's own limit above, and a
           # few long strings in user-facing messages read worse when split
]

[lint.per-file-ignores]
# The CLI is a single script by design (it must run from a bare checkout with
# no package layout), so its imports inside functions are intentional.
"bin/kivax" = ["E402"]

[lint.isort]
# The lib/ scripts import each other by bare module name (they run from the
# global store, not as a package), so isort would otherwise file them under
# third-party and merge them into the PyYAML import block.
known-first-party = ["kivax_lib", "kivax_agents", "kivax_state"]
