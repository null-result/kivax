# Deliberately permissive: this gate exists to catch real defects and to stop
# style being argued in review, not to reject a contribution over aesthetics.
#
# Kept as its own file rather than a [tool.ruff] table in pyproject.toml so the
# lint config stays readable next to the reasoning for it.
line-length = 110
target-version = "py310"

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes — undefined names, unused imports, real bugs
  "W",    # pycodestyle warnings
  "I",    # import sorting
  "UP",   # pyupgrade — don't write 3.6-era Python on a 3.10+ floor
  "B",    # flake8-bugbear — likely-wrong constructs
]
ignore = [
  "E501",  # line length is checked by the formatter's own limit above, and a
           # few long strings in user-facing messages read worse when split
]

[lint.per-file-ignores]
# `from . import DATA_DIR` sits below the guarded PyYAML import, which has to
# run first so a missing dependency produces the install hint rather than a
# traceback from somewhere deeper.
"src/kivax/cli.py" = ["E402"]

[lint.isort]
known-first-party = ["kivax"]
