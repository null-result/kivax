[pytest]
testpaths = tests
python_files = test_*.py
# The suite runs against the checkout, not against whatever version of kivax
# happens to be installed in the environment — so `pytest tests` works from a
# bare clone with nothing but pytest and PyYAML present.
pythonpath = src
markers =
    unit: fast, no subprocess, no filesystem beyond tmp_path — pure logic
    integration: exercises a CLI subcommand in-process against a scaffolded project
    e2e: a full multi-step flow, or a real subprocess invocation of the installed CLI
addopts = -ra --strict-markers
