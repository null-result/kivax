# Canonical anchor of ONE feature's specification. Generated by spec-compiler
# from that feature's spec.md, and living beside it in the feature's directory:
#   <paths.features>/FF-<slug>/spec.yml
#
# RULES:
#  - Every id carries this feature's number FF (REQ-FF-NNN, AC-FF-NNN-MM,
#    IT-FF-NNN). That prefix must match the directory the file is in, and it
#    never changes for the life of the feature.
#  - NNN is allocated per feature, from 001 upward. Ids are immutable once
#    assigned, and the id of a removed requirement is never reused —
#    requirements are marked `status: deprecated`, not deleted.
#  - Ids are unique across the WHOLE project, so a test tag resolves to exactly
#    one requirement in exactly one feature.
#  - Hashes are NOT stored here: they're computed and recorded in
#    traceability.lock.json. `meta` is excluded from hashing, so moving this
#    file or rewriting meta.source cannot invalidate a single test.
meta:
  feature: feature-name
  version: 1
  status: draft          # draft | approved
  source: specs/FF-feature-name/spec.md

context: >
  Summary of the context and motivation.

requirements:
  - id: REQ-FF-001
    title: Short behavior title
    status: active        # active | deprecated
    priority: must        # must | should | could
    depends_on: []        # may reference another feature's REQ, e.g. REQ-01-003
    description: >
      Observable, verifiable behavior.
    acceptance_criteria:
      - id: AC-FF-001-01
        given: initial state
        when: action
        then: observable result
    edge_cases:
      - edge case description
    notes: ""             # free-form field, EXCLUDED from the hash

integration_scenarios:
  - id: IT-FF-001
    title: Main end-to-end flow
    covers: [REQ-FF-001]
    given: full system state
    when: flow executed
    then: observable result

non_goals:
  - What's out of scope
