name: Feature request
description: Suggest a change to the flow, the CLI, or the agents and skills.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you unable to do today? Describe the situation rather than the
        solution — it often turns out the flow already covers it another way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part does this touch?
      options:
        - The CLI (kivax init / feature / upgrade / promote / doctor)
        - The flow's scripts (validate, hash, trace, specfirst, wiki, state)
        - An agent or a skill (the instructions the assistant reads)
        - Traceability and the anchoring model
        - Documentation
        - Not sure
    validations:
      required: true
