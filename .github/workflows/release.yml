name: Release

# Publishing is triggered by a GitHub Release, not by a bare tag push: the
# release is the human decision, and a tag can be pushed by accident.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The release tag must match src/kivax/data/VERSION
        # PyPI rejects a re-upload of an existing version, so a mismatch here
        # would otherwise surface as a confusing 400 at the very last step —
        # or, worse, silently publish a version nobody tagged.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(cat src/kivax/data/VERSION)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "release tag '$TAG' does not match VERSION '$version'"
            echo "bump src/kivax/data/VERSION, or retag the release"
            exit 1
          fi
          test -f "dist/kivax-$version.tar.gz"
          test -f "dist/kivax-$version-py3-none-any.whl"

      - name: Check the distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment is where the PyPI trusted publisher is bound, and it's
    # the place to add a required reviewer if publishing should ever need a
    # second pair of eyes.
    environment:
      name: pypi
      url: https://pypi.org/p/kivax
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no API token to store, rotate, or leak. Configure it once at
      # https://pypi.org/manage/project/kivax/settings/publishing/ with
      # owner null-result, repo kivax, workflow release.yml, environment pypi.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
